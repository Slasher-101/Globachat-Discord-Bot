; Copy this file to config.ini before first run (docker compose expects
; config.ini to already exist so it can bind-mount it correctly).
;
; [DEFAULT] applies to every server the bot is in, unless a server has its
; own section below overriding specific keys.

[DEFAULT]
target_lang = EN
mode = all
min_chars = 2
ignore_bots = true
; Minimum lead (0-100) the top locally-detected language needs over the
; runner-up guess before a message is considered "actually a different
; language" and sent off to be translated. This is a MARGIN, not a raw
; confidence score - short text spreads probability thin across every
; candidate language, so a genuine foreign phrase and a misidentified
; English fragment can land at similarly low raw scores; how far ahead the
; top guess is over 2nd place is what actually separates a real signal from
; noise. Raise this if you're seeing false positives (short messages/slang
; getting mistranslated); lower it if genuinely foreign short messages are
; being missed. Detection is restricted to the languages listed in the
; bot's /autotranslate language autocomplete, so obscure/implausible
; languages are never candidates in the first place.
confidence_threshold = 7

; Per-server overrides: the section name is the Discord server (guild) ID.
; To get it: enable Developer Mode in Discord (Settings > Advanced), then
; right-click the server icon > Copy Server ID.
;
; [123456789012345678]
; target_lang = FR
; min_chars = 3
; ; Optional: restrict to specific channels (comma-separated channel IDs).
; ; Omit this line entirely to watch every channel in the server.
; channels = 111111111111111111,222222222222222222
